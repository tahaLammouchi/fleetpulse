# .github/workflows/fleet-api-ci.yml
name: Fleet API — CI

on:
  push:
    paths:
      - "services/fleet-api/**"
  pull_request:
    paths:
      - "services/fleet-api/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fleet-api

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: fleetpulse_test
          POSTGRES_USER: fleetpulse
          POSTGRES_PASSWORD: fleetpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Lint (Checkstyle)
        run: ./mvnw checkstyle:check

      - name: Build
        run: ./mvnw compile

      - name: Run unit + integration tests
        run: ./mvnw test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fleetpulse_test
          SPRING_DATASOURCE_USERNAME: fleetpulse
          SPRING_DATASOURCE_PASSWORD: fleetpulse