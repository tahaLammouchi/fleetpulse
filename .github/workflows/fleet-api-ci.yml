# .github/workflows/fleet-api-ci.yml
name: Fleet API — CI

on:
  push:
    paths:
      - "services/fleet-api/**"
  pull_request:
    paths:
      - "services/fleet-api/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fleet-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Lint (Checkstyle)
        run: ./mvnw checkstyle:check

      - name: Build
        run: ./mvnw compile

      - name: Run unit tests
        run: ./mvnw test

      - name: Run integration tests
        run: ./mvnw verify -Dskip.surefire.tests=true